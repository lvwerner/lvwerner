name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar animação de contribuições
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#16324F&color_dots=#EBEDF0,#C6E3F2,#9AD0EC,#3D7FB0,#16324F
            dist/snake-dark.svg?palette=github-dark&color_snake=#9AD0EC&color_dots=#161B22,#16324F,#2B5C85,#5FA3CF,#9AD0EC

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
